name: Node packages

# Builds the OpenWrt node client and packages it for both of OpenWrt's package
# formats. 24.10 and earlier use .ipk with opkg; 25.12 and later use .apk with
# apk. Both come from the one recipe in packaging/openwrt, because the format is
# a property of the SDK rather than of the recipe.
#
# Publishing a release attaches every package and binary to it as a direct
# download. Build artifacts are only used to hand files between jobs and for
# looking at a run that did not come from a release; GitHub always serves those
# as a zip, which is why the release assets exist.

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - 'packaging/openwrt/**'
      - 'contracts/enrollment/**'
      - '.github/workflows/node-packages.yml'
  pull_request:
    paths:
      - 'node/**'
      - 'packaging/openwrt/**'
      - 'contracts/enrollment/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the packages to this existing release tag'
        required: false
        type: string

permissions:
  contents: read

env:
  # Bump these to move to a newer point release. The SDK file name also carries
  # a gcc version that changes between releases, so it is discovered rather than
  # written down here.
  RELEASE_IPK: 24.10.8
  RELEASE_APK: 25.12.5

jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache: false

      - name: Vet
        run: go vet ./...
        working-directory: node

      - name: Test
        run: go test -count=1 ./...
        working-directory: node

      - name: Build every target
        run: make dist
        working-directory: node

      # make dist regenerates SHA256SUMS as a build product, so a mismatch here
      # means the checksum file and the binaries disagree, which is the thing
      # the router is told to compare.
      - name: Checksums match the binaries
        run: sha256sum -c SHA256SUMS
        working-directory: node/dist

      - uses: actions/upload-artifact@v4
        with:
          name: node-binaries
          path: node/dist/
          if-no-files-found: error

  packages:
    name: ${{ matrix.release }} ${{ matrix.target }}
    needs: binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: '24.10.8', target: 'x86/64',        goarch: amd64  }
          - { release: '24.10.8', target: 'armsr/armv8',   goarch: arm64  }
          - { release: '24.10.8', target: 'ramips/mt7621', goarch: mipsle }
          - { release: '25.12.5', target: 'x86/64',        goarch: amd64  }
          - { release: '25.12.5', target: 'armsr/armv8',   goarch: arm64  }
          - { release: '25.12.5', target: 'ramips/mt7621', goarch: mipsle }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: node-binaries
          path: node/dist

      # The SDK's own prerequisite check refuses to run without these two, and
      # says so only after unpacking.
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip libncurses-dev zstd

      - name: Name this build
        id: tag
        run: echo "tag=${{ matrix.release }}-$(echo '${{ matrix.target }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Find the SDK
        id: sdk
        run: |
          base="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}"
          name=$(curl -sSf "$base/" | grep -o 'openwrt-sdk-[^"]*\.tar\.zst' | head -1)
          if [ -z "$name" ]; then
            echo "no SDK found under $base" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "url=$base/$name" >> "$GITHUB_OUTPUT"
          echo "dir=${name%.tar.zst}" >> "$GITHUB_OUTPUT"

      - name: Cache the SDK
        id: sdkcache
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: sdk-${{ steps.sdk.outputs.name }}

      - name: Download the SDK
        if: steps.sdkcache.outputs.cache-hit != 'true'
        run: curl -sSfL -o sdk.tar.zst "${{ steps.sdk.outputs.url }}"

      - name: Unpack the SDK
        run: tar --zstd -xf sdk.tar.zst

      - name: Add the package
        run: |
          sdk="${{ steps.sdk.outputs.dir }}"
          mkdir -p "$sdk/package/shadow9-node"
          cp -r packaging/openwrt/. "$sdk/package/shadow9-node/"
          cp node/dist/shadow9-node-linux-* "$sdk/package/shadow9-node/files/"

      - name: Feeds
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: |
          # Feeds are cloned pinned to a commit, which leaves a detached HEAD
          # that a later git pull cannot update. The indexes are what matter.
          ./scripts/feeds update base packages luci || true
          ./scripts/feeds install luci-proto-wireguard wireguard-tools ca-bundle || true

      - name: Configure
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: |
          # The Go binary is already stripped by its own linker flags and built
          # reproducibly. Letting OpenWrt's sstrip run again drops the ELF
          # section headers, which makes the packaged binary differ from the one
          # node/dist publishes checksums for.
          touch .config
          sed -i '/^CONFIG_USE_SSTRIP=/d; /^CONFIG_USE_STRIP=/d; /^CONFIG_NO_STRIP=/d; /^CONFIG_PACKAGE_shadow9-node=/d' .config
          printf 'CONFIG_NO_STRIP=y\nCONFIG_PACKAGE_shadow9-node=m\n' >> .config
          make defconfig

      - name: Build
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: make package/shadow9-node/compile -j"$(nproc)"

      # Catches a reintroduced strip, and catches the recipe packaging the wrong
      # architecture's binary, which its ARCH mapping is supposed to prevent.
      - name: Packaged binary matches the published one
        run: |
          sdk="${{ steps.sdk.outputs.dir }}"
          staged=$(find "$sdk/build_dir" -path '*/shadow9-node/usr/sbin/shadow9-node' | head -1)
          if [ -z "$staged" ]; then
            echo "no staged binary found under $sdk/build_dir" >&2
            exit 1
          fi
          published="node/dist/shadow9-node-linux-${{ matrix.goarch }}"
          if ! cmp -s "$staged" "$published"; then
            echo "the packaged binary differs from $published" >&2
            ls -l "$staged" "$published" >&2
            exit 1
          fi
          echo "packaged binary is byte-identical to $published"

      # OpenWrt names every .apk shadow9-node-<version>.apk with no architecture
      # in it, so all three would collide as release assets. The .ipk names
      # already carry their package architecture and are left alone.
      - name: Collect
        run: |
          sdk="${{ steps.sdk.outputs.dir }}"
          mkdir -p out
          for f in $(find "$sdk/bin" -type f \( -name 'shadow9-node*.ipk' -o -name 'shadow9-node*.apk' \)); do
            case "$f" in
              *.apk) cp "$f" "out/$(basename "$f" .apk)_$(echo '${{ matrix.target }}' | tr '/' '-').apk" ;;
              *)     cp "$f" out/ ;;
            esac
          done
          if [ -z "$(ls -A out)" ]; then
            echo "no package was produced" >&2
            exit 1
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.tag.outputs.tag }}
          path: out/
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [binaries, packages]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gather every built file
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      # download-artifact gives one directory per artifact. Releases want a flat
      # set of files, and the names are already unique across every target.
      - name: Flatten and checksum
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.ipk' -o -name '*.apk' -o -name 'shadow9-node-linux-*' \) \
            -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "nothing was built to publish" >&2
            exit 1
          fi
          ( cd release && sha256sum * > SHA256SUMS )
          cat release/SHA256SUMS

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "no release tag to attach to" >&2
            exit 1
          fi
          gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached $(ls release | wc -l) files to $tag"

name: Release

# Run this from the Actions tab to cut a release. It builds the node client for
# every target, creates the tag and the release, and attaches each package and
# binary as a direct download rather than a zip.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.1.0'
        required: true
        type: string
      draft:
        description: 'Create it as a draft so you can look before it is public'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark it as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Reuses the CI workflow rather than repeating the six-target matrix, so a
  # release is built exactly the way every push is built.
  build:
    uses: ./.github/workflows/node-packages.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Create the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Work out the tag
        id: version
        run: |
          raw='${{ inputs.version }}'
          # Accept 0.1.0 or v0.1.0 and settle on one spelling.
          bare="${raw#v}"
          if ! printf '%s' "$bare" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "'$raw' is not a version like 0.1.0" >&2
            exit 1
          fi
          echo "tag=v$bare" >> "$GITHUB_OUTPUT"
          echo "bare=$bare" >> "$GITHUB_OUTPUT"

      - name: Gather every built file
        uses: actions/download-artifact@v8
        with:
          path: downloaded

      # download-artifact gives one directory per artifact. A release wants a
      # flat set, and the names are already unique across every target.
      - name: Flatten and checksum
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.ipk' -o -name '*.apk' -o -name 'shadow9-node-linux-*' \) \
            -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "the build produced nothing to release" >&2
            exit 1
          fi
          ( cd release && sha256sum * > SHA256SUMS )
          echo "### Files in this release" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes=$(cat <<'EOF'
          OpenWrt node client for the shadow9 WireGuard hub.

          Install it on an OpenWrt 24.10.x or 25.12.x router:

          ```sh
          release="$(. /etc/openwrt_release; echo "$DISTRIB_RELEASE")"
          machine="$(uname -m)"
          case "$machine" in
            x86_64) ipk_arch=x86_64; apk_arch=x86-64 ;;
            aarch64) ipk_arch=aarch64_generic; apk_arch=armsr-armv8 ;;
            mips*) ipk_arch=mipsel_24kc; apk_arch=ramips-mt7621 ;;
            *) echo "No shadow9 package matches $machine"; exit 1 ;;
          esac
          case "$release" in
            24.10.*) file="shadow9-node___VERSION__-r1_${ipk_arch}.ipk"; package=ipk ;;
            25.12.*) file="shadow9-node-__VERSION__-r1_${apk_arch}.apk"; package=apk ;;
            *) echo "No shadow9 package matches OpenWrt $release"; exit 1 ;;
          esac
          base="https://github.com/__REPOSITORY__/releases/download/__TAG__"
          wget -O "/tmp/$file" "$base/$file"
          wget -O /tmp/SHA256SUMS "$base/SHA256SUMS"
          checksum="$(grep -F "  $file" /tmp/SHA256SUMS)" || {
            echo "SHA256SUMS has no entry for $file"
            exit 1
          }
          (cd /tmp && printf '%s\n' "$checksum" | sha256sum -c -) || exit 1
          case "$package" in
            ipk) opkg install "/tmp/$file" ;;
            apk) apk add --allow-untrusted "/tmp/$file" ;;
          esac
          ```

          Replace the hub address, token, and advertised LAN, then join:

          ```sh
          shadow9-node join -hub http://<hub>:8081 -token <token> -advertise 192.168.1.0/24
          ```
          EOF
          )
          version="${TAG#v}"
          notes="${notes//__VERSION__/$version}"
          notes="${notes//__REPOSITORY__/$GITHUB_REPOSITORY}"
          notes="${notes//__TAG__/$TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG exists, replacing its files"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              ${{ inputs.draft && '--draft' || '' }} \
              ${{ inputs.prerelease && '--prerelease' || '' }}
          fi
          echo "attached $(ls release | wc -l) files to $TAG"
          gh release view "$TAG" --json url -q .url >> "$GITHUB_STEP_SUMMARY"

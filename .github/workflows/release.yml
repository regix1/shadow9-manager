name: Release

# Run this from the Actions tab to cut a release. It builds the node client for
# every target, creates the tag and the release, and attaches each package and
# binary as a direct download rather than a zip.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.1.0'
        required: true
        type: string
      draft:
        description: 'Create it as a draft so you can look before it is public'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark it as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The tag you type here is the only place a version is decided. This job writes
  # it into VERSION and commits it, so `shadow9 update`, which reads a git
  # checkout rather than a build artifact, reports the release it pulled.
  record:
    name: Record the version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      bare: ${{ steps.version.outputs.bare }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the tag
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          raw="$VERSION_INPUT"
          # Accept 0.1.0 or v0.1.0 and settle on one spelling.
          bare="${raw#v}"
          if ! printf '%s' "$bare" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "'$raw' is not a version like 0.1.0" >&2
            exit 1
          fi
          echo "tag=v$bare" >> "$GITHUB_OUTPUT"
          echo "bare=$bare" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # this cannot loop back into the build.
      - name: Commit the version
        id: commit
        run: |
          printf '%s\n' "${{ steps.version.outputs.bare }}" > VERSION
          if git diff --quiet -- VERSION; then
            echo "VERSION already reads ${{ steps.version.outputs.bare }}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "Release ${{ steps.version.outputs.tag }}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Reuses the CI workflow rather than repeating the six-target matrix, so a
  # release is built exactly the way every push is built.
  build:
    needs: record
    uses: ./.github/workflows/node-packages.yml
    with:
      version: ${{ needs.record.outputs.bare }}

  publish:
    name: Create the release
    needs: [record, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.record.outputs.sha }}

      - name: Gather every built file
        uses: actions/download-artifact@v8
        with:
          path: downloaded

      # download-artifact gives one directory per artifact. A release wants a
      # flat set, and the names are already unique across every target.
      - name: Flatten and checksum
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.ipk' -o -name '*.apk' -o -name 'shadow9-node-linux-*' \) \
            -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "the build produced nothing to release" >&2
            exit 1
          fi
          ( cd release && sha256sum * > SHA256SUMS )
          echo "### Files in this release" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.record.outputs.tag }}
          BUILD_SHA: ${{ needs.record.outputs.sha }}
        run: |
          notes=$(cat <<'EOF'
          OpenWrt node client for the shadow9 WireGuard hub.

          Install it on an OpenWrt 24.10.x or 25.12.x router:

          ```sh
          release="$(. /etc/openwrt_release; echo "$DISTRIB_RELEASE")"
          machine="$(uname -m)"
          case "$machine" in
            x86_64) ipk_arch=x86_64; apk_arch=x86-64 ;;
            aarch64) ipk_arch=aarch64_generic; apk_arch=armsr-armv8 ;;
            mips*) ipk_arch=mipsel_24kc; apk_arch=ramips-mt7621 ;;
            *) echo "No shadow9 package matches $machine"; exit 1 ;;
          esac
          case "$release" in
            24.10.*) file="shadow9-node___VERSION__-r1_${ipk_arch}.ipk"; package=ipk ;;
            25.12.*) file="shadow9-node-__VERSION__-r1_${apk_arch}.apk"; package=apk ;;
            *) echo "No shadow9 package matches OpenWrt $release"; exit 1 ;;
          esac
          base="https://github.com/__REPOSITORY__/releases/download/__TAG__"
          wget -O "/tmp/$file" "$base/$file"
          wget -O /tmp/SHA256SUMS "$base/SHA256SUMS"
          checksum="$(grep -F "  $file" /tmp/SHA256SUMS)" || {
            echo "SHA256SUMS has no entry for $file"
            exit 1
          }
          (cd /tmp && printf '%s\n' "$checksum" | sha256sum -c -) || exit 1
          case "$package" in
            ipk) opkg install "/tmp/$file" ;;
            apk) apk add --allow-untrusted "/tmp/$file" ;;
          esac
          ```

          Replace the hub address, token, and advertised LAN, then join:

          ```sh
          shadow9-node join -hub http://<hub>:8081 -token <token> -advertise 192.168.1.0/24
          ```

          The default route is isolated in the first unused table at or above 51820 for
          PBR; normal WAN traffic is unchanged until a policy selects wg0. Add
          `-site-only` for only the tunnel and advertised sites, or `-table <id>` to pin a
          specific table. Policy mode verifies that pbr is installed before changing UCI.
          `shadow9-node uninstall` removes only Shadow9-owned UCI sections; other
          WireGuard interfaces and PBR policies are left unchanged.
          EOF
          )
          version="${TAG#v}"
          notes="${notes//__VERSION__/$version}"
          notes="${notes//__REPOSITORY__/$GITHUB_REPOSITORY}"
          notes="${notes//__TAG__/$TAG}"

          # Pin the tag before calling the release API. A retry must either create it at
          # this build or prove that the existing tag already names this build.
          if git fetch --no-tags origin "refs/tags/$TAG" 2>/dev/null; then
            tag_sha=$(git rev-parse "FETCH_HEAD^{commit}")
            if [ "$tag_sha" != "$BUILD_SHA" ]; then
              echo "$TAG points to $tag_sha, but this run built $BUILD_SHA" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$BUILD_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG exists, replacing its files"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --notes "$notes" \
              --verify-tag \
              ${{ inputs.draft && '--draft' || '' }} \
              ${{ inputs.prerelease && '--prerelease' || '' }}
          fi
          echo "attached $(ls release | wc -l) files to $TAG"
          gh release view "$TAG" --json url -q .url >> "$GITHUB_STEP_SUMMARY"
